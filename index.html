<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 32px;
    }

    h1 {
      font-size: 1.75rem;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      color: #333;
    }

    .input-row input:focus {
      border-color: #6c63ff;
    }

    .input-row button {
      padding: 10px 18px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .input-row button:hover {
      background: #574fd6;
    }

    .input-row button:active {
      transform: scale(0.97);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filters button {
      flex: 1;
      padding: 7px;
      border: 2px solid #e0e0e0;
      background: transparent;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    .filters button:hover:not(.active) {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    #todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .todo-item:hover {
      background: #f8f7ff;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #f0f0f0;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6c63ff;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item label {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      cursor: pointer;
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed label {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      color: #ccc;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      color: #e55353;
      background: #fff0f0;
    }

    .empty-state {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: #aaa;
    }

    .footer button {
      background: none;
      border: none;
      cursor: pointer;
      color: #e55353;
      font-size: 0.82rem;
      padding: 0;
      transition: opacity 0.2s;
    }

    .footer button:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>✅ To-Do List</h1>

    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new task…"
        aria-label="New task"
        maxlength="200"
      />
      <button id="add-btn" aria-label="Add task">Add</button>
    </div>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="completed">Completed</button>
    </div>

    <ul id="todo-list" aria-label="Task list"></ul>

    <div class="footer">
      <span id="items-left"></span>
      <button id="clear-completed">Clear completed</button>
    </div>
  </main>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    let todos = JSON.parse(localStorage.getItem('kiro-todos') || '[]');
    let filter = 'all';
    let nextId = todos.length ? Math.max(...todos.map(t => t.id)) + 1 : 1;

    // ── Persist ──────────────────────────────────────────────────────────────
    function save() {
      localStorage.setItem('kiro-todos', JSON.stringify(todos));
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      const list = document.getElementById('todo-list');
      const itemsLeft = document.getElementById('items-left');
      const clearBtn = document.getElementById('clear-completed');

      const visible = todos.filter(t => {
        if (filter === 'active') return !t.completed;
        if (filter === 'completed') return t.completed;
        return true;
      });

      list.innerHTML = '';

      if (visible.length === 0) {
        list.innerHTML = '<li class="empty-state">No tasks here — nice! 🎉</li>';
      } else {
        visible.forEach(todo => {
          const li = document.createElement('li');
          li.className = 'todo-item' + (todo.completed ? ' completed' : '');
          li.dataset.id = todo.id;

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = todo.completed;
          cb.id = `todo-${todo.id}`;
          cb.setAttribute('aria-label', `Mark "${todo.text}" as ${todo.completed ? 'active' : 'completed'}`);
          cb.addEventListener('change', () => toggle(todo.id));

          const label = document.createElement('label');
          label.htmlFor = cb.id;
          label.textContent = todo.text;

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.innerHTML = '&#x2715;';
          delBtn.setAttribute('aria-label', `Delete "${todo.text}"`);
          delBtn.addEventListener('click', () => remove(todo.id));

          li.append(cb, label, delBtn);
          list.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.completed).length;
      itemsLeft.textContent = `${activeCount} item${activeCount !== 1 ? 's' : ''} left`;

      const hasCompleted = todos.some(t => t.completed);
      clearBtn.style.visibility = hasCompleted ? 'visible' : 'hidden';
    }

    // ── Actions ──────────────────────────────────────────────────────────────
    function addTodo(text) {
      text = text.trim();
      if (!text) return;
      todos.push({ id: nextId++, text, completed: false });
      save();
      render();
    }

    function toggle(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) todo.completed = !todo.completed;
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    function clearCompleted() {
      todos = todos.filter(t => !t.completed);
      save();
      render();
    }

    // ── Event listeners ──────────────────────────────────────────────────────
    document.getElementById('add-btn').addEventListener('click', () => {
      const input = document.getElementById('todo-input');
      addTodo(input.value);
      input.value = '';
      input.focus();
    });

    document.getElementById('todo-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        document.getElementById('add-btn').click();
      }
    });

    document.getElementById('clear-completed').addEventListener('click', clearCompleted);

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    // ── Init ─────────────────────────────────────────────────────────────────
    render();
  </script>
</body>
</html>
